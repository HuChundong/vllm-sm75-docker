apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen3
  namespace: vllm
  labels:
    app: vllm-qwen3
spec:
  type: NodePort
  selector:
    app: vllm-qwen3
  ports:
    - name: http
      port: 8000          # in-cluster: vllm-qwen3.vllm.svc:8000
      targetPort: 8000
      nodePort: 30832     # external: http://<node-ip>:30832
